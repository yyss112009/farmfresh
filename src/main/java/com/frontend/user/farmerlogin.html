<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Registration | FarmFresh</title>
<script src="api.js"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url("https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1500&q=80");
    background-size:cover;
    background-position:center;
    min-height:100vh;
    padding:30px 15px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.page-wrap{
    width:100%;
    max-width:450px;
}

.top-link{
    text-align:center;
    margin-bottom:15px;
}

.top-link a{
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    background:rgba(0,0,0,0.35);
    padding:8px 18px;
    border-radius:20px;
    display:inline-block;
}

.top-link a:hover{
    background:rgba(0,0,0,0.55);
}

.container{
    width:100%;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#2e8b57;
    margin-bottom:20px;
    font-size:26px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

textarea{
    resize:none;
    height:70px;
}

.btn13{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#2e8b57;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

.btn13:hover{
    background:#1b5e20;
}

.login-link{
    text-align:center;
    margin-top:15px;
}

.login-link a{
    color:#2e8b57;
    text-decoration:none;
    font-weight:bold;
}

.login-link a:hover{
    text-decoration:underline;
}

.form-msg{
    text-align:center;
    font-weight:bold;
    margin-top:10px;
    display:none;
}

.form-msg.error{ color:#c62828; }
.form-msg.success{ color:#1b5e20; }

@media (max-width:576px){
    .container{
        padding:22px;
        border-radius:8px;
    }
    h2{
        font-size:22px;
    }
    input, textarea, select{
        font-size:14px;
        padding:9px;
    }
}
</style>
</head>

<body>

<div class="page-wrap">

    <div class="top-link">
        <a href="frounted.html">← Back to FarmFresh Home</a>
    </div>

    <div class="container">

        <h2>🌾 Farmer Registration</h2>

        <p id="formMsg" class="form-msg"></p>

        <form id="farmerForm">

            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter Full Name" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter Email" required>

            <label>Mobile Number</label>
            <input type="tel" id="mobile" placeholder="Enter Mobile Number" pattern="[0-9]{10}" title="Enter a 10-digit mobile number" required>

            <label>Farm Name</label>
            <input type="text" id="farmName" placeholder="Enter Farm Name" required>

            <label>Farm Address</label>
            <textarea id="farmAddress" placeholder="Enter Farm Address" required></textarea>

            <label>State</label>
            <select id="state" required>
                <option value="">Select State</option>
                <option>Maharashtra</option>
                <option>Karnataka</option>
                <option>Gujarat</option>
                <option>Madhya Pradesh</option>
                <option>Uttar Pradesh</option>
                <option>Rajasthan</option>
            </select>

            <label>Password</label>
            <input type="password" id="password" placeholder="Create Password" minlength="6" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

            <button class="btn13" type="submit">Register</button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="loginpage.html">Login Here</a>
        </div>

    </div>

</div>
<script>
    document.getElementById('farmerForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const mobile = document.getElementById('mobile').value.trim();
        const farmName = document.getElementById('farmName').value.trim();
        const farmAddress = document.getElementById('farmAddress').value.trim();
        const state = document.getElementById('state').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const msg = document.getElementById('formMsg');
        const submitBtn = e.target.querySelector('button[type="submit"]');

        if (password !== confirmPassword) {
            msg.textContent = 'Passwords do not match.';
            msg.className = 'form-msg error';
            msg.style.display = 'block';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering...';

        try {
            const auth = await ffPost('/auth/register/farmer', {
                fullName: fullName,
                email: email,
                mobile: mobile,
                farmName: farmName,
                farmAddress: farmAddress,
                state: state,
                password: password
            });

            ffSaveSession(auth);

            msg.textContent = 'Registration successful! Redirecting to your dashboard...';
            msg.className = 'form-msg success';
            msg.style.display = 'block';

            setTimeout(function () {
                window.location.href = '../farmer/farmerdash.html';
            }, 1000);
        } catch (err) {
            msg.textContent = err.message;
            msg.className = 'form-msg error';
            msg.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Register';
        }
    });
</script>

</body>
</html>
