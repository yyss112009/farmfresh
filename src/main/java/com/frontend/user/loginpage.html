<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FarmFresh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="api.js"></script>
  <!-- Custom navbar (plain HTML/CSS/JS — no Bootstrap component behind it) -->
<style>
/* ============================================================
   FarmFresh — shared site navbar
   Pure HTML/CSS (no Bootstrap). Linked from every page.
   ============================================================ */

.ff-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: #16341f;
    box-shadow: 0 2px 14px rgba(0, 0, 0, .18);
}

.ff-nav-container {
    max-width: 1320px;
    margin: 0 auto;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
}

/* ---- brand / logo ---- */
.ff-nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    flex-shrink: 0;
}

.ff-nav-logo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #7DB13A;
    background: #fff;
}

.ff-nav-brand span {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: .3px;
}

/* ---- collapsible menu wrapper (mobile) ---- */
.ff-nav-menu {
    display: flex;
    align-items: center;
    gap: 28px;
    flex: 1;
    justify-content: flex-end;
}

.ff-nav-links {
    display: flex;
    list-style: none;
    gap: 24px;
    margin: 0;
    padding: 0;
}

.ff-nav-link {
    color: #dfe7d8;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    padding: 6px 1px;
    position: relative;
    transition: color .2s ease;
    white-space: nowrap;
}

.ff-nav-link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -3px;
    width: 0;
    height: 2px;
    background: #7DB13A;
    transition: width .25s ease;
}

.ff-nav-link:hover,
.ff-nav-link.active {
    color: #fff;
}

.ff-nav-link:hover::after,
.ff-nav-link.active::after {
    width: 100%;
}

/* ---- search ---- */
.ff-nav-search {
    display: flex;
    align-items: center;
}

.ff-nav-search input {
    background: rgba(255, 255, 255, .1);
    border: 1px solid rgba(255, 255, 255, .28);
    color: #fff;
    padding: 8px 14px;
    border-radius: 20px 0 0 20px;
    width: 190px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s ease;
}

.ff-nav-search input::placeholder {
    color: #c7d0bf;
}

.ff-nav-search input:focus {
    border-color: #7DB13A;
}

.ff-nav-search button {
    border: none;
    background: #7DB13A;
    color: #fff;
    padding: 0 16px;
    height: 36px;
    border-radius: 0 20px 20px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s ease;
}

.ff-nav-search button:hover {
    background: #5f9626;
}

.ff-nav-search svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
}

/* ---- login / cart actions ---- */
.ff-nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

.ff-nav-btn {
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 20px;
    border-radius: 22px;
    white-space: nowrap;
    transition: background .2s ease, border-color .2s ease, color .2s ease;
    display: inline-flex;
    align-items: center;
    gap: 7px;
}

.ff-nav-btn svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
}

.ff-nav-btn-outline {
    color: #fff;
    border: 1.5px solid rgba(255, 255, 255, .5);
    background: transparent;
}

.ff-nav-btn-outline:hover,
.ff-nav-btn-outline.active {
    background: rgba(255, 255, 255, .12);
    border-color: #fff;
}

.ff-nav-btn-fill {
    background: #7DB13A;
    color: #fff;
    border: 1.5px solid #7DB13A;
    position: relative;
}

.ff-nav-btn-fill:hover,
.ff-nav-btn-fill.active {
    background: #5f9626;
    border-color: #5f9626;
}

.ff-cart-badge {
    position: absolute;
    top: -8px;
    right: -8px;
    min-width: 20px;
    height: 20px;
    padding: 2px 5px;
    border-radius: 50%;
    background: #dc3545;
    color: #fff;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    border: 2px solid #16341f;
}

/* ---- hamburger toggle (mobile) ---- */
.ff-nav-toggle {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 36px;
    height: 36px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
}

.ff-nav-toggle span {
    display: block;
    height: 2px;
    width: 100%;
    background: #fff;
    border-radius: 2px;
    transition: transform .3s ease, opacity .3s ease;
}

.ff-nav-toggle.open span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
}

.ff-nav-toggle.open span:nth-child(2) {
    opacity: 0;
}

.ff-nav-toggle.open span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
}

/* push page content below the fixed header */
body {
    padding-top: 76px;
}

/* ---- responsive ---- */
@media (max-width: 991px) {
    .ff-nav-toggle {
        display: flex;
    }

    .ff-nav-menu {
        position: fixed;
        top: 64px;
        left: 0;
        width: 100%;
        max-height: 0;
        overflow: hidden;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        background: #16341f;
        transition: max-height .35s ease;
        box-shadow: 0 8px 14px rgba(0, 0, 0, .15);
    }

    .ff-nav-menu.open {
        max-height: 560px;
    }

    .ff-nav-links {
        flex-direction: column;
        gap: 0;
        padding: 8px 24px 0;
    }

    .ff-nav-link {
        padding: 13px 0;
        border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .ff-nav-link::after {
        display: none;
    }

    .ff-nav-search {
        padding: 16px 24px 0;
    }

    .ff-nav-search input {
        flex: 1;
        width: auto;
    }

    .ff-nav-actions {
        flex-direction: column;
        align-items: stretch;
        padding: 16px 24px 22px;
        gap: 10px;
    }

    .ff-nav-btn {
        justify-content: center;
    }

    body {
        padding-top: 64px;
    }
}

@media (max-width: 400px) {
    .ff-nav-container {
        padding: 8px 16px;
    }

    .ff-nav-brand span {
        font-size: 19px;
    }
}

</style>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
        url("https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1500&q=80");
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 15px;
    }
    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }

    .login-box h2 {
      text-align: center;
      color: #2e8b57;
      margin-bottom: 20px;
      font-size: 26px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    .btn12 {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #2e8b57;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: .2s;
    }

    .btn12:hover {
      background: #1b5e20;
    }

    .links {
      text-align: center;
      margin-top: 15px;
    }

    .links a {
      text-decoration: none;
      color: #2e8b57;
      font-weight: bold;
    }

    .links a:hover {
      text-decoration: underline;
    }

    #loginError {
      color: #c62828;
      font-weight: bold;
      display: none;
      margin-top: 10px;
      text-align: center;
    }

    @media (max-width: 576px) {
      .login-box {
        padding: 22px;
        border-radius: 8px;
      }

      .login-box h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <header class="ff-header">
    <div class="ff-nav-container">
      <a class="ff-nav-brand" href="frounted.html">
        <img src="pic41.jpeg" alt="FarmFresh logo" class="ff-nav-logo">
        <span>FarmFresh</span>
      </a>

      <button class="ff-nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="ff-nav-menu" id="navMenu">
        <ul class="ff-nav-links">
          <li><a class="ff-nav-link" href="frounted.html">Home</a></li>
          <li><a class="ff-nav-link" href="ourproduct.html">Shop</a></li>
          <li><a class="ff-nav-link" href="contact.html">Contact</a></li>
        </ul>

        <form class="ff-nav-search" id="siteSearchForm" role="search">
          <input type="search" id="siteSearchInput" placeholder="Search products" aria-label="Search products">
          <button type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </form>

        <div class="ff-nav-actions">
          <a class="ff-nav-btn ff-nav-btn-outline active" href="loginpage.html">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Login
          </a>
          <a class="ff-nav-btn ff-nav-btn-fill" href="mycard.html">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            My Cart
            <span id="cartBadge" class="ff-cart-badge">0</span>
          </a>
        </div>
      </nav>
    </div>
  </header>

  <div class="login-box">

    <h2>🌾 FarmFresh Login</h2>

    <p id="loginError"></p>

    <form id="loginForm">

      <label>Login As</label>
      <select id="userType" required>
        <option value="">-- Select User Type --</option>
        <option value="customer">Customer</option>
        <option value="farmer">Farmer</option>
        <option value="admin">Admin</option>
      </select>

      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Enter Email" required>

      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter Password" required>

      <button class="btn12" type="submit">Login</button>

    </form>

    <div class="links">
      <p><a href="customerlogin.html">Customer Register</a></p>
      <p><a href="farmerlogin.html">Farmer Register</a></p>
    </div>

  </div>
<script>
document.addEventListener("DOMContentLoaded", function () {
    /* ---- mobile menu toggle ---- */
    var toggle = document.getElementById("navToggle");
    var menu = document.getElementById("navMenu");

    if (toggle && menu) {
        toggle.addEventListener("click", function () {
            var isOpen = menu.classList.toggle("open");
            toggle.classList.toggle("open", isOpen);
            toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });

        menu.querySelectorAll(".ff-nav-link").forEach(function (link) {
            link.addEventListener("click", function () {
                menu.classList.remove("open");
                toggle.classList.remove("open");
                toggle.setAttribute("aria-expanded", "false");
            });
        });
    }

    /* ---- shared cart badge (one source of truth for every page) ---- */
    var CART_KEY = "farmfreshCart";

    function ffGetCart() {
        try {
            return JSON.parse(localStorage.getItem(CART_KEY)) || [];
        } catch (e) {
            return [];
        }
    }

    function ffSaveCart(cart) {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
        ffUpdateBadge();
    }

    function ffUpdateBadge() {
        var badge = document.getElementById("cartBadge");
        if (!badge) return;

        var count = ffGetCart().reduce(function (sum, item) {
            return sum + Number(item.quantity || 0);
        }, 0);

        badge.textContent = count;
        badge.style.display = count > 0 ? "flex" : "none";
    }

    // exposed so each page's own script can reuse the same cart helpers
    // instead of redefining getCart/saveCart/updateBadge on every page
    window.ffCart = {
        get: ffGetCart,
        save: ffSaveCart,
        updateBadge: ffUpdateBadge
    };

    ffUpdateBadge();

    /* ---- navbar search ----
       On the shop page itself the search filters the grid in place
       (ourproduct.html defines window.ffApplyNavSearch). Everywhere
       else it just hands the query to the shop page via the URL. */
    var searchForm = document.getElementById("siteSearchForm");
    var searchInput = document.getElementById("siteSearchInput");

    if (searchForm) {
        searchForm.addEventListener("submit", function (e) {
            e.preventDefault();
            var query = (searchInput.value || "").trim();

            if (typeof window.ffApplyNavSearch === "function") {
                window.ffApplyNavSearch(query);
                menu && menu.classList.remove("open");
                toggle && toggle.classList.remove("open");
            } else {
                window.location.href =
                    "ourproduct.html" + (query ? ("?search=" + encodeURIComponent(query)) : "");
            }
        });
    }
});
</script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const session = ffGetSession();
      if (session) {
        const errorBox = document.getElementById('loginError');
        errorBox.style.background = '#e7f3ea';
        errorBox.style.color = '#1b5e20';
        errorBox.style.border = '1px solid #c3e6cb';
        errorBox.innerHTML = 'You are currently logged in as <strong>' + (session.fullName || session.email) + '</strong> (' + session.role + '). <br><a href="#" onclick="ffLogout(\'loginpage.html\');return false;" style="color:#d9534f;text-decoration:underline;font-weight:600;">Logout here</a> or <a href="frounted.html" style="color:#2E8B57;text-decoration:underline;font-weight:600;">Go to Home</a>';
        errorBox.style.display = 'block';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const role = document.getElementById('userType').value;
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errorBox = document.getElementById('loginError');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      if (!role) {
        errorBox.style.background = '';
        errorBox.style.color = '';
        errorBox.style.border = '';
        errorBox.textContent = 'Please select a user type.';
        errorBox.style.display = 'block';
        return;
      }

      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const auth = await ffPost('/auth/login', { email, password, role });
        ffSaveSession(auth);
        ffRedirectForRole(auth.role);
      } catch (err) {
        errorBox.style.background = '';
        errorBox.style.color = '';
        errorBox.style.border = '';
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
  </script>
</body>

</html>
